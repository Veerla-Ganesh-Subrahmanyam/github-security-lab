name: Security Validation

on:
  pull_request:
    branches:
      - main

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Search for Passwords
        run: |
          if grep -R --exclude-dir=.github "password=" .; then
            echo "Password Found"
            exit 1
          fi

      - name: Validation Passed
        run: echo "No passwords detected"
